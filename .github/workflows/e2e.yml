name: E2E Tests — Playwright

on:
  push:
    branches: [prod/releaseV1, develop, 'feat/**']
  pull_request:
    branches: [prod/releaseV1, develop]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRY: 7d
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 500

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      # ── Install all three packages ──────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # ── Build client ────────────────────────────
      - name: Build client
        run: npm run build
        working-directory: client

      # ── Start backend server ────────────────────
      - name: Start backend server
        run: |
          npm start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
        working-directory: server

      # ── Start client preview server ─────────────
      - name: Start client preview server
        run: |
          npm run preview -- --port 3000 &
          echo "CLIENT_PID=$!" >> $GITHUB_ENV
        working-directory: client

      # ── Wait for both servers to be ready ───────
      - name: Wait for servers to be ready
        run: |
          echo "Waiting for backend (port 5000)..."
          npx wait-on http://localhost:5000/health --timeout 30000
          echo "Waiting for frontend (port 3000)..."
          npx wait-on http://localhost:3000 --timeout 30000
        working-directory: e2e

      # ── Run Playwright tests ─────────────────────
      - name: Run E2E tests
        run: npm test
        working-directory: e2e

      # ── Upload report on failure ─────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7
