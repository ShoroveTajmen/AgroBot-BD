<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroBot BD – Sign Up</title>
  <link rel="icon" href="/agro_icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      background: linear-gradient(160deg, #f0f7f0 0%, #e8f5e9 60%, #f5fff5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px 24px;
      width: 100%; max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }

    .logo { display: flex; justify-content: center; margin-bottom: 12px; }
    .logo img {
      width: 54px; height: 54px; border-radius: 50%;
      border: 3px solid #c8e6c9; background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center; font-size: 1.5rem;
      font-weight: 700; color: #2d5a2d; margin-bottom: 6px;
    }

    .subtitle {
      text-align: center; color: #777;
      font-size: 0.82rem; margin-bottom: 18px;
      line-height: 1.4;
    }

    form { display: flex; flex-direction: column; gap: 10px; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }

    label {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; color: #666;
      text-transform: uppercase;
    }

    .input-wrap {
      display: flex; align-items: center;
      background: #f0f4f0; border: 1.5px solid #ddd;
      border-radius: 8px; padding: 0 12px;
      transition: all 0.2s;
    }
    .input-wrap:focus-within { border-color: #2d6a2d; background: #fff; }

    .input-icon { font-size: 0.9rem; color: #999; margin-right: 8px; }

    .input-wrap input,
    .input-wrap select {
      flex: 1; border: none; background: transparent;
      padding: 10px 0; font-size: 0.88rem; color: #333; outline: none;
    }
    .input-wrap input::placeholder { color: #aaa; }
    .input-wrap select { cursor: pointer; color: #666; }

    .btn {
      width: 100%; padding: 12px; background: #1a4d1a; color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s; margin-top: 6px;
    }
    .btn:hover { background: #2d6a2d; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }

    .switch {
      margin-top: 14px; text-align: center;
      color: #666; font-size: 0.82rem;
    }
    .switch a { color: #1a4d1a; text-decoration: none; font-weight: 700; }
    .switch a:hover { text-decoration: underline; }

    .error {
      background: #ffebee; border: 1px solid #ef9a9a; color: #c62828;
      padding: 8px 12px; border-radius: 7px;
      font-size: 0.82rem; margin-bottom: 6px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="/agro_icon.png" alt="AgroBot" />
  </div>

  <h1>Welcome, Farmer</h1>
  <p class="subtitle">Join AgroBot BD to grow smarter and achieve better yields for your family.</p>

  <div id="errorMsg" class="error hidden"></div>

  <form id="signupForm">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="name" placeholder="Enter your full name" required />
      </div>
    </div>

    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <span class="input-icon">@</span>
        <input type="text" id="username" placeholder="Choose a unique username" required />
      </div>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">✉</span>
        <input type="email" id="email" placeholder="example@email.com" required />
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Enter a strong password" required />
      </div>
    </div>

    <div class="form-group">
      <label>Farming District</label>
      <div class="input-wrap">
        <span class="input-icon">📍</span>
        <select id="district">
          <option value="">Select your district</option>
          <option value="dhaka">Dhaka</option>
          <option value="chittagong">Chittagong</option>
          <option value="rajshahi">Rajshahi</option>
          <option value="khulna">Khulna</option>
          <option value="barisal">Barisal</option>
          <option value="sylhet">Sylhet</option>
          <option value="rangpur">Rangpur</option>
          <option value="mymensingh">Mymensingh</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn" id="signupBtn">Start Growing →</button>
  </form>

  <p class="switch">Already using AgroBot BD? <a href="/signin.html">Sign In</a></p>
</div>

<script type="module" src="/src/pages/signup.js"></script>
</body>
</html>
