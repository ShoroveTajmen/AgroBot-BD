<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroBot BD - AI Crop Disease Advisory</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      
      .app-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      
      .header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
      }
      
      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }
      
      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }
      
      .chat-container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        max-height: 80vh;
      }
      
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
      }
      
      .message {
        margin-bottom: 15px;
        padding: 12px 16px;
        border-radius: 12px;
        max-width: 80%;
        line-height: 1.5;
      }
      
      .message.user {
        background: #667eea;
        color: white;
        align-self: flex-end;
        margin-left: auto;
      }
      
      .message.bot {
        background: white;
        color: #333;
        align-self: flex-start;
        border: 1px solid #e0e0e0;
      }
      
      .message strong {
        color: #667eea;
      }
      
      .message.warning {
        background: #fff3cd;
        border: 1px solid #ffc107;
        color: #856404;
        padding: 15px;
        border-radius: 8px;
      }
      
      .input-container {
        display: flex;
        padding: 20px;
        background: white;
        border-top: 1px solid #e0e0e0;
      }
      
      .input-container input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 25px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s;
      }
      
      .input-container input:focus {
        border-color: #667eea;
      }
      
      .input-container button {
        margin-left: 10px;
        padding: 12px 24px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s;
      }
      
      .input-container button:hover {
        background: #5a6fd6;
      }
      
      .input-container button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      
      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #e0e0e0;
        border-radius: 50%;
        border-top-color: #667eea;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .advisory-section {
        margin-top: 15px;
        padding: 15px;
        background: #f0f7ff;
        border-radius: 8px;
        border-left: 4px solid #667eea;
      }
      
      .advisory-section h3 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 1.1rem;
      }
      
      .advisory-section ul {
        margin-left: 20px;
      }
      
      .advisory-section li {
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <h1>🌾 AgroBot BD</h1>
        <p>AI-Powered Crop Disease Advisory for Bangladeshi Farmers</p>
      </header>
      
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="input-container">
          <input 
            type="text" 
            id="userInput" 
            placeholder="Describe your crop problem (e.g., 'My rice leaves have brown spots and are turning yellow')"
            autocomplete="off"
          />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
