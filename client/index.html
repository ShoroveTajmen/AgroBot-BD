<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroBot BD – Chat</title>
  <link rel="icon" href="/agro_icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #1a4d1a;
      --green-mid: #2d6a2d;
      --green-light: #e8f5e9;
      --bg: #f0f7f0;
      --white: #ffffff;
      --header-h: 58px;
      --input-h: 68px;
      --nav-h: 62px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--white);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      z-index: 100;
    }
    .top-bar-left { display: flex; align-items: center; gap: 10px; }
    .top-bar-left img { width: 30px; height: 30px; border-radius: 50%; }
    .top-bar-left span { font-weight: 700; font-size: 1rem; color: var(--green-dark); }
    .top-bar-right { display: flex; align-items: center; gap: 8px; position: relative; }

    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; background: var(--green-light);
      cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: #c8e6c9; }

    /* ── Profile dropdown ── */
    .dropdown {
      position: absolute; top: 44px; right: 0;
      background: var(--white); border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
      padding: 14px; min-width: 210px; z-index: 200;
    }
    .dropdown-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .dropdown-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--green-light); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #4caf50;
    }
    .dropdown-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .dropdown-name { font-weight: 600; font-size: 0.9rem; color: #1a1a1a; }
    .dropdown-email { font-size: 0.78rem; color: #888; }
    .dropdown hr { border: none; border-top: 1px solid #eee; margin: 6px 0; }
    .dropdown-btn {
      width: 100%; padding: 9px 10px; border: none; background: none;
      text-align: left; cursor: pointer; border-radius: 8px;
      font-size: 0.88rem; color: #1a1a1a; transition: background 0.2s;
    }
    .dropdown-btn:hover { background: #f5f5f5; }
    .hidden { display: none !important; }

    /* ── Messages area ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: calc(var(--header-h) + 12px) 14px calc(var(--input-h) + var(--nav-h) + 8px);
    }

    .date-chip {
      text-align: center; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.1em; color: #888;
      background: #ddd; border-radius: 20px;
      padding: 3px 12px; display: inline-block;
      margin: 8px auto 14px; display: flex;
      justify-content: center; align-items: center;
    }

    .msg-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 14px; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      overflow: hidden; background: var(--green-light);
      border: 2px solid #c8e6c9;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-content { max-width: 74%; }

    .bubble {
      padding: 11px 15px; border-radius: 18px;
      font-size: 0.92rem; line-height: 1.5; word-break: break-word;
    }
    .msg-row.bot .bubble {
      background: var(--white); color: #1a1a1a;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .msg-row.user .bubble {
      background: var(--green-dark); color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-time { font-size: 0.7rem; color: #aaa; margin-top: 4px; padding: 0 3px; }
    .msg-row.user .msg-time { text-align: right; }

    /* Advisory card */
    .advisory-card {
      margin-top: 10px; padding: 12px;
      background: var(--green-light); border-radius: 10px;
      border-left: 4px solid var(--green-mid); font-size: 0.86rem;
    }
    .advisory-card h4 { color: var(--green-dark); margin-bottom: 6px; font-size: 0.88rem; }
    .advisory-card ul { margin-left: 16px; }
    .advisory-card li { margin-bottom: 3px; }
    .escalation-warn {
      margin-top: 8px; padding: 8px 12px;
      background: #fff3e0; border-radius: 8px;
      border-left: 4px solid #ff9800;
      font-size: 0.83rem; color: #e65100;
    }

    /* Typing dots */
    .typing { display: flex; align-items: center; gap: 4px; padding: 12px 15px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #aaa; animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ── Input bar ── */
    .input-bar {
      position: fixed;
      bottom: var(--nav-h); left: 0; right: 0;
      height: var(--input-h);
      padding: 10px 14px;
      background: var(--bg);
      display: flex; align-items: center;
    }
    .input-inner {
      display: flex; align-items: center; gap: 10px;
      background: var(--white); border-radius: 30px;
      padding: 8px 8px 8px 16px; width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    }
    .cam-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #aaa; flex-shrink: 0; }
    .input-inner input {
      flex: 1; border: none; outline: none;
      font-size: 0.92rem; color: #1a1a1a; background: transparent;
    }
    .input-inner input::placeholder { color: #bbb; }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--green-dark); border: none; color: #fff;
      font-size: 1rem; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .send-btn:hover { background: var(--green-mid); }
    .send-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--white);
      display: flex; border-top: 1px solid #e0e0e0;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      border: none; background: none; cursor: pointer;
      color: #aaa; font-size: 0.7rem; transition: color 0.2s;
    }
    .nav-item.active { color: var(--green-dark); }
    .nav-icon { font-size: 1.2rem; }
  </style>
</head>
<body>

<!-- Header -->
<div class="top-bar">
  <div class="top-bar-left">
    <img src="/agro_icon.png" alt="AgroBot BD" />
    <span>AgroBot BD</span>
  </div>
  <div class="top-bar-right">
    <button class="icon-btn" title="Notifications">🔔</button>
    <button class="icon-btn" id="profileBtn" title="Profile">
      <img src="/user_icon.png" alt="profile" style="width:22px;height:22px;border-radius:50%;border:2px solid #4caf50;" />
    </button>

    <!-- Dropdown -->
    <div class="dropdown hidden" id="dropdown">
      <div class="dropdown-user">
        <div class="dropdown-avatar">
          <img src="/user_icon.png" alt="avatar" />
        </div>
        <div>
          <div class="dropdown-name" id="dName">User</div>
          <div class="dropdown-email" id="dEmail">user@email.com</div>
        </div>
      </div>
      <hr />
      <button class="dropdown-btn" id="logoutBtn">🚪 Logout</button>
    </div>
  </div>
</div>

<!-- Messages -->
<div class="messages-wrap" id="messagesWrap">
  <div class="date-chip">TODAY</div>
  <div id="msgContainer"></div>
</div>

<!-- Input -->
<div class="input-bar">
  <div class="input-inner">
    <button class="cam-btn" title="Upload photo">📷</button>
    <input type="text" id="msgInput" placeholder="Type your question..." autocomplete="off" />
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-item active"><span class="nav-icon">💬</span>Chat</button>
  <button class="nav-item"><span class="nav-icon">🌾</span>Crops</button>
  <button class="nav-item"><span class="nav-icon">☀️</span>Weather</button>
  <button class="nav-item"><span class="nav-icon">👤</span>Profile</button>
</nav>

<script type="module" src="/src/pages/chat.js"></script>
</body>
</html>
