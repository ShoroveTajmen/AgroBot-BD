<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroBot BD – Sign In</title>
  <link rel="icon" href="../agro_icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #f0f7f0 0%, #e8f5e9 60%, #f5fff5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; color: #1a4d1a; }
    .logo img { width: 30px; height: 30px; border-radius: 50%; }
    .help-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid #1a4d1a; background: transparent;
      color: #1a4d1a; font-weight: 700; cursor: pointer; font-size: 0.85rem;
    }

    /* ── Main ── */
    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }

    .card {
      background: #fff; border-radius: 14px;
      padding: 36px 32px; width: 100%; max-width: 460px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
    }

    .card-logo { display: flex; justify-content: center; margin-bottom: 18px; }
    .card-logo img {
      width: 68px; height: 68px; border-radius: 50%;
      border: 3px solid #c8e6c9; padding: 4px; background: #e8f5e9;
    }

    h1 { text-align: center; font-size: 1.75rem; font-weight: 700; color: #1a4d1a; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 28px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; color: #666; margin-bottom: 6px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .label-row label { margin-bottom: 0; }
    .forgot { font-size: 0.8rem; color: #2d6a2d; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }

    .input-wrap {
      display: flex; align-items: center;
      background: #f5f5f5; border: 1.5px solid #e0e0e0;
      border-radius: 8px; padding: 0 12px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #2d6a2d; background: #fff; }
    .input-icon { font-size: 0.95rem; color: #aaa; margin-right: 8px; flex-shrink: 0; }
    .input-wrap input {
      flex: 1; border: none; background: transparent;
      padding: 12px 0; font-size: 0.95rem; color: #1a1a1a; outline: none;
    }
    .toggle-pw { background: none; border: none; cursor: pointer; font-size: 0.95rem; color: #aaa; padding: 0; }

    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: #555; margin-bottom: 20px; }
    .checkbox-row input { width: 15px; height: 15px; accent-color: #2d6a2d; }

    .btn {
      width: 100%; padding: 13px; background: #1a4d1a; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #2d6a2d; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }

    .switch { margin-top: 20px; text-align: center; color: #666; font-size: 0.9rem; }
    .switch a { color: #1a4d1a; text-decoration: none; font-weight: 700; }
    .switch a:hover { text-decoration: underline; }

    .error {
      background: #ffebee; border: 1px solid #ef9a9a; color: #c62828;
      padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px;
    }
    .hidden { display: none !important; }

    footer {
      text-align: center; padding: 16px; color: #aaa; font-size: 0.78rem;
    }
    footer a { color: #aaa; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="../agro_icon.png" alt="AgroBot BD" />
    AgroBot BD
  </div>
  <button class="help-btn" title="Help">?</button>
</header>

<main>
  <div class="card">
    <div class="card-logo">
      <img src="../agro_icon.png" alt="AgroBot" />
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to manage your crops and check field data</p>

    <div id="errorMsg" class="error hidden"></div>

    <form id="signinForm">
      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input type="email" id="email" placeholder="e.g. name@example.com" required />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>PASSWORD</label>
          <a href="#" class="forgot">Forgot Password?</a>
        </div>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" required />
          <button type="button" class="toggle-pw" id="togglePw">👁</button>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="keepSignedIn" />
        <label for="keepSignedIn">Keep me signed in</label>
      </div>

      <button type="submit" class="btn" id="loginBtn">Login →</button>
    </form>
  </div>

  <p class="switch">Don't have an account? <a href="/signup.html">Register Now</a></p>
</main>

<footer>
  <a href="#">Privacy Policy</a> &bull; <a href="#">Terms of Service</a><br />
  © 2024 AgroBot BD. Empowering Bangladeshi agriculture with AI solutions.
</footer>

<script type="module" src="/src/pages/signin.js"></script>
</body>
</html>
